services:
  postgres:
    image: postgres:16-alpine
    container_name: kalubampa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c max_wal_size=2GB
        -c min_wal_size=512MB
        -c synchronous_commit=off
        -c max_connections=200
        -c log_min_duration_statement=500
    networks:
      - kalubampa_net

  redis:
    image: redis:7-alpine
    container_name: kalubampa_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy noeviction
    networks:
      - kalubampa_net

  dashboard:
    build:
      context: ..
      dockerfile: podman/Containerfile.rails
    container_name: kalubampa_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      RAILS_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kalubampa_net
    command: >
      sh -c "bundle exec rails db:prepare && bundle exec puma -C config/puma.rb"

  sidekiq:
    build:
      context: ..
      dockerfile: podman/Containerfile.rails
    container_name: kalubampa_sidekiq
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      RAILS_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kalubampa_net
    command: bundle exec sidekiq -C config/sidekiq.yml

  worker:
    build:
      context: ..
      dockerfile: podman/Containerfile.worker
    container_name: kalubampa_worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      HTTP_CONCURRENCY: "${HTTP_CONCURRENCY:-100}"
      BATCH_SIZE: "${BATCH_SIZE:-20}"
      MAX_REQUEUE_COUNT: "${MAX_REQUEUE_COUNT:-3}"
      STATS_INTERVAL: "${STATS_INTERVAL:-30}"
      WORKER_ID: "${WORKER_ID:-worker-podman-01}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kalubampa_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kalubampa_net:
    driver: bridge
    name: kalubampa_net
